<!DOCTYPE html>
<html lang="pt=br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="contatos.css">
</head>

<body>

    <header>
        <div class="caixa">
            <h1><img src="./img/logo.png" alt="logo"></h1>
            <nav class="menu">
                <ul>
                    <li><a href="index.html"> home</a></li>
                    <li><a href="produtos.html"> produtos</a></li>
                    <li><a href="contatos.html"> contatos</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <form action="">

            <label for="nome">Nome e Sobrenome</label>
            <input type="text" id="nome" class="input-padrao" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" class="input-padrao" required placeholder="seuemail@dominio.com">

            <label for="tel">Telefone</label>
            <input type="tel" id="tel" class="input-padrao" required placeholder="(99)99999-9999">

            <label for="mensagem">Mensagem</label>
            <textarea name="" id="" cols="67" rows="10"></textarea>

            <legend>Como prefere o nosso contato</legend>

            <label for="radio-email"><input type="radio" name="contatos" id="radio-email">e-mail</label>
            
            <label for="radio-telefone"><input type="radio" name="contatos" id="radio-telefone">telefone</label>
            

            <label for="radio-whatsapp"><input type="radio" name="contatos" id="radio-whatsapp">whatsapp</label>

            <legend>Qual horario prefere ser atendido?</legend>
            <select name="" id="">
                <option value="">Manhã</option>
                <option value="">Tarde</option>
                <option value="">Noite</option>
            </select>
            
            
            <label for="checkbox"><input type="checkbox" name="" id="checkbox" class="checkbox">Gostaria de receber nossas novidades por e-mail.</label>
            

            <input type="submit" value="Enviar">

        </form>
    </main>
    <footer>
        <img src="./img/logo-branco.png" alt="logo-branco">
        <p>&#169;copyright Barbearia Space for Man</p>
    </footer>

</body>

</html>
